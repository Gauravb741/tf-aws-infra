# =============================================================================
# TERRAFORM PLAN WORKFLOW
#
# Purpose: Show exactly what infrastructure changes would be made.
# Runs after all checks pass. Posts the plan as a PR comment so reviewers
# can see infrastructure changes before approving a merge.
#
# Triggers:
#   - Pull request to main (with AWS credentials)
#
# Requires:
#   - GitHub Secrets: none (uses OIDC — no long-lived keys)
#   - GitHub Variables: AWS_ROLE_ARN, AWS_REGION, DOCKER_IMAGE
#   - GitHub Environment: "dev" (for OIDC role)
# =============================================================================

name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/terraform-apply.yml"

# Permissions required for OIDC authentication with AWS
permissions:
  contents: read
  pull-requests: write
  id-token: write   # Required for OIDC — allows GitHub to request a JWT

jobs:
  # ---------------------------------------------------------------------------
  # Plan Dev Environment
  # ---------------------------------------------------------------------------
  plan-dev:
    name: Plan (dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      # OIDC: Exchange GitHub JWT for temporary AWS credentials
      # No long-lived access keys stored anywhere.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-plan-dev

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: terraform/environments/dev

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="docker_image=${{ vars.DOCKER_IMAGE }}" \
            -no-color \
            -out=tfplan.out \
            2>&1 | tee plan-output.txt
        working-directory: terraform/environments/dev
        continue-on-error: true

      # Post the plan output as a PR comment so reviewers can see changes
      - name: Post plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync(
              'terraform/environments/dev/plan-output.txt', 'utf8'
            );
            const maxLength = 60000;
            const truncated = planOutput.length > maxLength
              ? planOutput.substring(0, maxLength) + '\n...[truncated]'
              : planOutput;
            
            const body = `## Terraform Plan — dev

            **Result:** ${{ steps.plan.outcome }}

            <details>
            <summary>Show Plan Output</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`
            </details>

            *Plan generated by: \`${{ github.workflow }}\` | Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Plan status check
        if: steps.plan.outcome == 'failure'
        run: exit 1