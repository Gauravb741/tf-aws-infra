# =============================================================================
# TERRAFORM APPLY WORKFLOW
#
# Purpose: Deploy infrastructure to dev and prod.
# Production requires manual approval via GitHub Environments.
#
# Triggers:
#   - Push to main branch
#
# Flow:
#   Push to main
#       |
#       v
#   Build & push Docker image
#       |
#       v
#   Deploy to dev (automatic)
#       |
#       v
#   Wait for manual approval (prod environment protection)
#       |
#       v
#   Deploy to prod
#
# Requires:
#   - GitHub Environment "dev" with OIDC role
#   - GitHub Environment "prod" with OIDC role and required reviewer
#   - GitHub Variables: AWS_ROLE_ARN, AWS_REGION, DOCKER_USERNAME
#   - GitHub Secrets: DOCKER_PASSWORD (Docker Hub access token)
# =============================================================================

name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "app/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read
  id-token: write   # OIDC
  packages: write   # Docker (GitHub Container Registry alternative)

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build and push Docker image
  # Build once, deploy to both dev and prod.
  # Image is tagged with the Git SHA for immutable, traceable releases.
  # ---------------------------------------------------------------------------
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_full: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_USERNAME }}/devops-platform-app
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.run_number }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: app/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to Dev
  # Runs automatically after Docker build succeeds.
  # No approval required for dev.
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: docker-build-push
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-apply-dev

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/environments/dev

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="docker_image=${{ vars.DOCKER_USERNAME }}/devops-platform-app:${{ needs.docker-build-push.outputs.image_tag }}" \
            -out=tfplan.out
        working-directory: terraform/environments/dev

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan.out
        working-directory: terraform/environments/dev

      - name: Get outputs
        id: outputs
        run: |
          APP_URL=$(terraform output -raw application_url)
          HEALTH_URL=$(terraform output -raw health_check_url)
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "health_url=$HEALTH_URL" >> "$GITHUB_OUTPUT"
        working-directory: terraform/environments/dev

      - name: Verify deployment
        run: |
          echo "Waiting for application to start (90s)..."
          sleep 90

          echo "Checking health endpoint: ${{ steps.outputs.outputs.health_url }}"
          
          MAX_RETRIES=5
          RETRY_DELAY=15
          
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 15 \
              "${{ steps.outputs.outputs.health_url }}" || echo "000")
            
            echo "  Attempt $i: HTTP $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Deployment verified successfully"
              echo "Application URL: ${{ steps.outputs.outputs.app_url }}"
              exit 0
            fi
            
            if [ "$i" -lt "$MAX_RETRIES" ]; then
              sleep $RETRY_DELAY
            fi
          done
          
          echo "WARNING: Health check did not return 200 after $MAX_RETRIES attempts."
          echo "The instance may still be bootstrapping. Check user-data logs."
          echo "SSH: ssh ec2-user@INSTANCE_IP"
          echo "Logs: sudo cat /var/log/user-data.log"

  # ---------------------------------------------------------------------------
  # Job 3: Deploy to Prod
  # Requires manual approval via the "prod" GitHub Environment.
  #
  # HOW TO CONFIGURE APPROVAL:
  #   1. Go to GitHub repository → Settings → Environments
  #   2. Create environment named "prod"
  #   3. Enable "Required reviewers"
  #   4. Add yourself (or your team) as required reviewer
  #   5. Enable "Prevent self-review" if desired
  #
  # The workflow pauses here until someone approves in the GitHub UI.
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs:
      - docker-build-push
      - deploy-dev
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-apply-prod

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/environments/prod

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="docker_image=${{ vars.DOCKER_USERNAME }}/devops-platform-app:${{ needs.docker-build-push.outputs.image_tag }}" \
            -out=tfplan.out
        working-directory: terraform/environments/prod

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan.out
        working-directory: terraform/environments/prod

      - name: Get outputs
        id: outputs
        run: |
          APP_URL=$(terraform output -raw application_url)
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
        working-directory: terraform/environments/prod

      - name: Verify prod deployment
        run: |
          echo "Waiting for application to start (90s)..."
          sleep 90
          
          HEALTH_URL="${{ steps.outputs.outputs.app_url }}/health"
          echo "Checking: $HEALTH_URL"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 15 \
            "$HEALTH_URL" || echo "000")
          
          echo "HTTP status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Production deployment verified"
          else
            echo "WARNING: Health check returned $HTTP_STATUS — verify manually"
          fi
          
          echo "Production URL: ${{ steps.outputs.outputs.app_url }}"